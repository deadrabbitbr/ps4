<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.manifest">
<head>
    <link rel="icon" type="image/png" href="../deadavatar.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SERMANOVICZ // 11.00-13.00 POOPS</title>
<style>
    :root {
        --bg: #151515;
        --panel: #1c1c1c;
        --panel-2: #242424;
        --line: #2e2e2e;
        --line-bright: #454545;
        --text: #f5f5f5;
        --muted: #b5b5b5;
        --dim: #828282;
        --accent: #ff9494;
        --red: #ff9b9b;
        --amber: #e1bd72;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #000000; }
    html, body { min-height: 100%; }
    body {
        background: linear-gradient(135deg, #3b0000 0%, #000000 100%) no-repeat fixed;
        color: var(--text);
        font: 16px/1.45 Consolas, "Liberation Mono", monospace;
        min-height: 100vh;
        overflow: hidden;
    }

    .app { margin: 0 auto; padding: 14px 26px 12px; width: min(100% - 52px, 1220px); }

    /* Barra de status superior */
    .bar {
        align-items: center;
        border: 1px solid var(--line-bright);
        display: flex;
        font-size: 14px;
        justify-content: space-between;
        letter-spacing: .1em;
        padding: 10px 16px;
        text-transform: uppercase;
    }
    .bar b { color: var(--accent); font-weight: 400; }
    .bar-chain { color: var(--dim); }
    .bar-chain::before { color: var(--accent); content: "\25CF "; }

    #state { color: var(--accent); font-size: 22px; font-weight: 400; line-height: 1.25; margin: 18px 0 10px; }
    .ok { color: var(--accent); }
    .bad { color: var(--red); }
    .warn { color: var(--amber); }

    /* o JS da cadeia rola este elemento - mantenha overflow e altura fixa */
    #out {
        background: var(--panel);
        border: 1px solid var(--line-bright);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        line-height: 1.45;
        height: calc(100vh - 150px);
        overflow-y: auto;
        padding: 12px 14px;
        white-space: pre-wrap;
    }

    @media (max-width: 760px) {
        .app { padding: 8px 10px; width: min(100% - 20px, 560px); }
        .bar { font-size: 12px; padding: 8px 12px; }
        #state { font-size: 19px; margin: 14px 0 8px; }
        #out { height: calc(100vh - 120px); font-size: 12px; }
    }
</style>
</head>
<body>
    <div class="app">
        <header class="bar">
            <span><b>SERMANOVICZ</b> // hosts ps4</span>
            <span class="bar-chain">cadeia poops</span>
        </header>

        <div id="state">carregando cadeia poops...</div>
        <div id="out"></div>
    </div>
<script type="module">import "./chain_poops.js";</script>
<script>
// SERMANOVICZ: recarregamento automatico DESATIVADO para poops (12.50/12.52/13.00).
</script></body>
</html>
